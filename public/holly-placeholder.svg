<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 800" width="640" height="800" role="img" aria-label="Placeholder for a photograph of Holly">
  <!--
    TEMPORARY. Replace with a real photograph of Holly.

    This is deliberately ugly so nobody mistakes it for a finished design and
    ships it. For a service where a stranger holds your house key, a real face
    is the single biggest trust signal on the page — stock photography of a
    model with a cat actively hurts, because Boca is a small market and
    Holly's whole asset is that she is the person who has been doing this
    since 2006.

    To replace: drop the photo at src/assets/holly.jpg and update the import
    in src/pages/index.astro and src/pages/about.astro.
  -->
  <defs>
    <pattern id="hatch" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="16" height="16" fill="#f7dde2"/>
      <line x1="0" y1="0" x2="0" y2="16" stroke="#f0c4cd" stroke-width="8"/>
    </pattern>
  </defs>

  <rect width="640" height="800" fill="url(#hatch)"/>
  <rect x="12" y="12" width="616" height="776" fill="none" stroke="#a93b63" stroke-width="4" stroke-dasharray="18 12"/>

  <g transform="translate(320 330)" fill="#a93b63" opacity="0.65">
    <circle cx="0" cy="-30" r="62"/>
    <path d="M-104 96c0-57 47-98 104-98s104 41 104 98z"/>
  </g>

  <text x="320" y="530" text-anchor="middle" font-family="Georgia, serif" font-size="42" font-weight="bold" fill="#4a2340">
    Photo of Holly
  </text>
  <text x="320" y="578" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" fill="#6b5a62">
    placeholder — replace before launch
  </text>
  <text x="320" y="620" text-anchor="middle" font-family="system-ui, sans-serif" font-size="19" fill="#6b5a62">
    src/assets/holly.jpg
  </text>
</svg>
